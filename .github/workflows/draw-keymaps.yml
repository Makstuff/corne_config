name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "config/keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      parse_args: ""
      draw_args: ""

  convert_to_png:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2
          pip install keymap-drawer cairosvg
      - name: Generate SVGs and Convert to PNGs
        run: |
          for yaml_file in keymap-drawer/*.yaml; do
            base_name=$(basename "$yaml_file" .yaml)
            
            # Restore triangles to layer activators
            sed -i 's/- {type: held}/- {t: "▽", type: held}/g' "$yaml_file"
            
            # Clean up the old named files so they get removed from git
            rm -f "keymap-drawer/${base_name}.svg"
            rm -f "keymap-drawer/${base_name}.png"
            
            # Redraw horizontal SVG and generate PNG
            keymap -c config/keymap_drawer.config.yaml draw -j config/info.json "$yaml_file" > "keymap-drawer/${base_name}_horizontal.svg"
            cairosvg -b white --output-width 1200 -o "keymap-drawer/${base_name}_horizontal.png" "keymap-drawer/${base_name}_horizontal.svg"
            
            # Redraw vertical SVG and generate PNG
            sed -i 's/n_columns: 3/n_columns: 1/g' config/keymap_drawer.config.yaml
            keymap -c config/keymap_drawer.config.yaml draw -j config/info.json "$yaml_file" > "keymap-drawer/${base_name}_vertical.svg"
            git restore config/keymap_drawer.config.yaml
            cairosvg -b white --output-width 1200 -o "keymap-drawer/${base_name}_vertical.png" "keymap-drawer/${base_name}_vertical.svg"
          done
      - name: Commit Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore config/keymap_drawer.config.yaml
          git pull origin ${{ github.ref_name }} --rebase --autostash
          git rm -q keymap-drawer/*.svg || true
          git rm -q keymap-drawer/*.png || true
          git add keymap-drawer/*_horizontal.svg keymap-drawer/*_horizontal.png
          git add keymap-drawer/*_vertical.svg keymap-drawer/*_vertical.png
          git commit -m "Update keymap SVGs and PNGs" || exit 0
          git push origin HEAD:${{ github.ref_name }}
