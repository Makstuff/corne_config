parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  zmk_keycode_map:
    # Home row mappings (Base/MIR)
    A: {t: "A", type: "homerow"}
    I: {t: "I", type: "homerow"}
    E: {t: "E", type: "homerow"}
    N: {t: "N", type: "homerow"}
    C: {t: "C", type: "homerow"}
    T: {t: "T", type: "homerow"}
    R: {t: "R", type: "homerow"}
    S: {t: "S", type: "homerow"}
    
    # Home row mappings (SYM) using original DE_ names
    DE_EQUAL: {t: "=", type: "homerow"}
    DE_SEMI: {t: ";", type: "homerow"}
    DE_LPAR: {t: "(", type: "homerow"}
    DE_RPAR: {t: ")", type: "homerow"}
    DE_QMARK: {t: "?", type: "homerow"}
    DE_UNDER: {t: "_", type: "homerow"}
    DE_COLON: {t: ":", type: "homerow"}
    DE_AT: {t: "@", type: "homerow"}

    # Home row mappings (NUM)
    N0: {t: "0", type: "homerow"}
    N3: {t: "3", type: "homerow"}
    N2: {t: "2", type: "homerow"}
    N1: {t: "1", type: "homerow"}

    # Home row mappings (NAV)
    LEFT: {t: "←", type: "homerow"}
    DOWN: {t: "↓", type: "homerow"}
    RIGHT: {t: "→", type: "homerow"}
    F5: {t: "F5", type: "homerow"}
    F6: {t: "F6", type: "homerow"}
    F7: {t: "F7", type: "homerow"}
    F8: {t: "F8", type: "homerow"}

    # Home row mappings (SYS)
    BT_SEL 0: {t: "BT 0", type: "homerow"}
    BT_SEL 1: {t: "BT 1", type: "homerow"}
    BT_SEL 2: {t: "BT 2", type: "homerow"}
    BT_SEL 3: {t: "BT 3", type: "homerow"}
    RGB_SAI: {t: "SAI", type: "homerow"}
    RGB_BRI: {t: "BRI", type: "homerow"}
    RGB_SPI: {t: "SPI", type: "homerow"}
    RGB_EFF: {t: "EFF", type: "homerow"}

    # Standard mappings for DE_ macros
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_COMMA: ","
    DE_SQT: "'"
    DE_DOT: "."
    
    # Base Modifiers and Keys
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    PRINTSCREEN: "⎙"

    # Macros
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(LA(LG(C))): "Crop"
    LC(F): "⌃F"
    LG(DE_DOT): "Emoji"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_CLR: "BT CLR"
    BT_SEL: "BT"
    RGB_TOG: "RGB TG"
    RGB_COLOR_HSB(0,100,50): "RED"
    RGB_COLOR_HSB(126,100,50): "GRN"
    RGB_COLOR_HSB(244,100,50): "BLU"
    RGB_COLOR_HSB(309,100,50): "PUR"
    RGB_COLOR_HSB(61,100,50): "YEL"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  svg_extra_style: |
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    g.homerow rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
