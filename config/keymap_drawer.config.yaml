parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  raw_binding_map:
    # Rename layer toggle behaviors directly to their literal text
    '&to 0': "TO\nBASE"
    '&to 1': "TO\nSYM"
    '&to 2': "TO\nNUM"
    '&to 3': "TO\nNAV"
    '&to 4': "TO\nMIR"
    '&to 5': "TO\nSYS"
    
    # Map SYS layer colors and bootloader
    '&rgb_ug RGB_COLOR_HSB(0,100,50)': 'Red'
    '&rgb_ug RGB_COLOR_HSB(126,100,50)': 'Green'
    '&rgb_ug RGB_COLOR_HSB(244,100,50)': 'Blue'
    '&rgb_ug RGB_COLOR_HSB(309,100,50)': 'Purple'
    '&rgb_ug RGB_COLOR_HSB(61,100,50)': 'Yellow'
    '&bootloader': 'BOOT'

    # Map all kpb macros on MIR layer directly to their final display text
    '&kpb Q': 'Q'
    '&kpb L': 'L'
    '&kpb D': 'D'
    '&kpb M': 'M'
    '&kpb B': 'B'
    '&kpb ESC': '⎋'
    '&kpb S': 'S'
    '&kpb R': 'R'
    '&kpb T': 'T'
    '&kpb C': 'C'
    '&kpb G': 'G'
    '&kpb J': 'J'
    '&kpb DE_Z': 'Z'
    '&kpb X': 'X'
    '&kpb K': 'K'
    '&kpb W': 'W'
    '&kpb V': 'V'
    '&kpb ENTER': '⏎'
    '&kpb BACKSPACE': '⌫'
    '&kpb SPACE': '␣'
    '&kpb LSHFT': '⇧'
    '&kpb TAB': '⇥'
    '&kpb DE_SHARP_S': 'ß'
    '&kpb LGUI': '❖'

  zmk_keycode_map:
    # Long strings (> 2 chars) on standard layers receive the 'small' class
    LC(LA(LG(C))): {t: "Crop", type: "small"}
    LG(DE_DOT): {t: "Emoji", type: "small"}
    PG_UP: {t: "PgUp", type: "small"}
    PG_DN: {t: "PgDn", type: "small"}

    # SYS layer toggles (these will be shrunk automatically by the CSS layer rule below)
    BT_CLR: "BT CLR"
    RGB_TOG: "RGB TG"
    RGB_HUD: "HUD"
    RGB_SAD: "SAD"
    RGB_BRD: "BRD"
    RGB_SPD: "SPD"
    RGB_EFR: "EFR"
    RGB_HUI: "HUI"
    RGB_SAI: "SAI"
    RGB_BRI: "BRI"
    RGB_SPI: "SPI"
    RGB_EFF: "EFF"

    # SYM homerow keys 
    DE_EQUAL: "="
    DE_SEMI: ";"
    DE_LPAR: "("
    DE_RPAR: ")"
    DE_QMARK: "?"
    DE_UNDER: "_"
    DE_COLON: ":"
    DE_AT: "@"

    # Standard mappings for DE_ macros and mod-morph parameters
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_SQT: "'"
    DE_DOT: "."
    DE_COMMA: ","
    DE_PERIOD: "."
    DE_N2: '"'
    BACKSLASH: "'"
    
    # Base Modifiers and Keys (<= 2 chars)
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PRINTSCREEN: "⎙"

    # Macros (<= 2 chars)
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(F): "⌃F"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_SEL: "BT"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  n_columns: 3
  outer_pad_w: 15.0
  outer_pad_h: 35.0
  split_gap: 20.0
  svg_extra_style: |
    /* Move layer titles down by 0.2 key width (12px) to sit in the split gap */
    g[class*="layer-" i] > text {
      transform: translateY(12px);
    }
    /* Move the bottom row of layers 54px (0.9 key width) closer to the top row without cropping the viewBox */
    g[class*="layer-nav" i],
    g[class*="layer-mir" i],
    g[class*="layer-sys" i] {
      translate: 0 -54px;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    
    /* Style homerow keys purely by physical position in the SVG (indices 16-19 and 24-27) */
    g.key:nth-of-type(16) rect,
    g.key:nth-of-type(17) rect,
    g.key:nth-of-type(18) rect,
    g.key:nth-of-type(19) rect,
    g.key:nth-of-type(24) rect,
    g.key:nth-of-type(25) rect,
    g.key:nth-of-type(26) rect,
    g.key:nth-of-type(27) rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
    
    /* Shrink the font size of any key mapped via zmk_keycode_map with type: small */
    g.small text {
      font-size: 17.5px !important;
    }
    
    /* Shrink the font size of EVERY key on the SYS layer since they are all >2 characters */
    g[class*="layer-sys" i] g.key text {
      font-size: 17.5px !important;
    }

    /* Shrink the font size of raw_binding_map layer toggles by explicitly targeting their physical positions */
    g[class*="layer-base" i] g.key:nth-of-type(8) text,
    g[class*="layer-base" i] g.key:nth-of-type(22) text,
    g[class*="layer-base" i] g.key:nth-of-type(41) text.hold,
    g[class*="layer-base" i] g.key:nth-of-type(45) text.hold,
    g[class*="layer-base" i] g.key:nth-of-type(46) text,
    g[class*="layer-sym" i] g.key:nth-of-type(44) text,
    g[class*="layer-num" i] g.key:nth-of-type(8) text,
    g[class*="layer-num" i] g.key:nth-of-type(44) text,
    g[class*="layer-nav" i] g.key:nth-of-type(1) text,
    g[class*="layer-nav" i] g.key:nth-of-type(14) text,
    g[class*="layer-nav" i] g.key:nth-of-type(15) text,
    g[class*="layer-nav" i] g.key:nth-of-type(22) text,
    g[class*="layer-nav" i] g.key:nth-of-type(29) text,
    g[class*="layer-nav" i] g.key:nth-of-type(44) text,
    g[class*="layer-mir" i] g.key:nth-of-type(8) text,
    g[class*="layer-mir" i] g.key:nth-of-type(22) text,
    g[class*="layer-mir" i] g.key:nth-of-type(46) text {
      font-size: 17.5px !important;
    }

    /* Shift text content up on NAV and SYM thumb keys to prevent bottom border overlap */
    g[class*="layer-base" i] g.key:nth-of-type(41) text,
    g[class*="layer-base" i] g.key:nth-of-type(45) text {
      transform: translateY(-5px);
    }
