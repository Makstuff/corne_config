parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  raw_binding_map:
    # Rename layer toggle behaviors so they are parsed as simple keys
    '&to 0': '&kp TO_BASE'
    '&to 1': '&kp TO_SYM'
    '&to 2': '&kp TO_NUM'
    '&to 3': '&kp TO_NAV'
    '&to 4': '&kp TO_MIR'
    '&to 5': '&kp TO_SYS'

  zmk_keycode_map:
    # Layer toggles
    TO_BASE: "TO BASE"
    TO_SYM: "TO SYM"
    TO_NUM: "TO NUM"
    TO_NAV: "TO NAV"
    TO_MIR: "TO MIR"
    TO_SYS: "TO SYS"

    # Base Layer Mod-Morphs
    period: {t: ".", s: "'"}
    comma: {t: ",", s: '"'}

    # Standard mappings for DE_ macros
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_COMMA: ","
    DE_SQT: "'"
    DE_DOT: "."
    
    # Base Modifiers and Keys
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PRINTSCREEN: "⎙"
    bootloader: "BOOT"

    # Macros
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(LA(LG(C))): "Crop"
    LC(F): "⌃F"
    LG(DE_DOT): "Emoji"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_CLR: "BT CLR"
    BT_SEL: "BT"
    RGB_TOG: "RGB TG"
    RGB_COLOR_HSB(0,100,50): "Red"
    RGB_COLOR_HSB(126,100,50): "Green"
    RGB_COLOR_HSB(244,100,50): "Blue"
    RGB_COLOR_HSB(309,100,50): "Purple"
    RGB_COLOR_HSB(61,100,50): "Yellow"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  svg_extra_style: |
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    /* Style homerow keys purely by physical position in the SVG (indices 16-19 and 24-27) */
    g.key:nth-of-type(16) rect,
    g.key:nth-of-type(17) rect,
    g.key:nth-of-type(18) rect,
    g.key:nth-of-type(19) rect,
    g.key:nth-of-type(24) rect,
    g.key:nth-of-type(25) rect,
    g.key:nth-of-type(26) rect,
    g.key:nth-of-type(27) rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
