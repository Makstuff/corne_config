parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  raw_binding_map:
    # Rename layer toggle behaviors to valid unused ZMK keycodes so they parse cleanly through zmk_keycode_map
    '&to 0': '&kp F13'
    '&to 1': '&kp F14'
    '&to 2': '&kp F15'
    '&to 3': '&kp F16'
    '&to 4': '&kp F17'
    '&to 5': '&kp F18'
    
    # Map SYS layer colors and bootloader to unused keycodes for zmk_keycode_map styling
    '&rgb_ug RGB_COLOR_HSB(0,100,50)': '&kp F19'
    '&rgb_ug RGB_COLOR_HSB(126,100,50)': '&kp F20'
    '&rgb_ug RGB_COLOR_HSB(244,100,50)': '&kp F21'
    '&rgb_ug RGB_COLOR_HSB(309,100,50)': '&kp F22'
    '&rgb_ug RGB_COLOR_HSB(61,100,50)': '&kp F23'
    '&bootloader': '&kp F24'

    # Map all kpb macros on MIR layer directly to their final display text (1 char, no shrinking needed)
    '&kpb Q': 'Q'
    '&kpb L': 'L'
    '&kpb D': 'D'
    '&kpb M': 'M'
    '&kpb B': 'B'
    '&kpb ESC': '⎋'
    '&kpb S': 'S'
    '&kpb R': 'R'
    '&kpb T': 'T'
    '&kpb C': 'C'
    '&kpb G': 'G'
    '&kpb J': 'J'
    '&kpb DE_Z': 'Z'
    '&kpb X': 'X'
    '&kpb K': 'K'
    '&kpb W': 'W'
    '&kpb V': 'V'
    '&kpb ENTER': '⏎'
    '&kpb BACKSPACE': '⌫'
    '&kpb SPACE': '␣'
    '&kpb LSHFT': '⇧'
    '&kpb TAB': '⇥'
    '&kpb DE_SHARP_S': 'ß'
    '&kpb LGUI': '❖'

  zmk_keycode_map:
    # Long strings (> 2 chars) receive the 'small' class to shrink their font by 30%
    F13: {t: "TO\nBASE", type: "small"}
    F14: {t: "TO\nSYM", type: "small"}
    F15: {t: "TO\nNUM", type: "small"}
    F16: {t: "TO\nNAV", type: "small"}
    F17: {t: "TO\nMIR", type: "small"}
    F18: {t: "TO\nSYS", type: "small"}
    F19: {t: "Red", type: "small"}
    F20: {t: "Green", type: "small"}
    F21: {t: "Blue", type: "small"}
    F22: {t: "Purple", type: "small"}
    F23: {t: "Yellow", type: "small"}
    F24: {t: "BOOT", type: "small"}
    
    LC(LA(LG(C))): {t: "Crop", type: "small"}
    LG(DE_DOT): {t: "Emoji", type: "small"}
    BT_CLR: {t: "BT CLR", type: "small"}
    RGB_TOG: {t: "RGB TG", type: "small"}
    PG_UP: {t: "PgUp", type: "small"}
    PG_DN: {t: "PgDn", type: "small"}

    # SYS layer RGB toggles (> 2 chars)
    RGB_HUD: {t: "HUD", type: "small"}
    RGB_SAD: {t: "SAD", type: "small"}
    RGB_BRD: {t: "BRD", type: "small"}
    RGB_SPD: {t: "SPD", type: "small"}
    RGB_EFR: {t: "EFR", type: "small"}
    RGB_HUI: {t: "HUI", type: "small"}
    RGB_SAI: {t: "SAI", type: "small"}
    RGB_BRI: {t: "BRI", type: "small"}
    RGB_SPI: {t: "SPI", type: "small"}
    RGB_EFF: {t: "EFF", type: "small"}

    # SYM homerow keys 
    DE_EQUAL: "="
    DE_SEMI: ";"
    DE_LPAR: "("
    DE_RPAR: ")"
    DE_QMARK: "?"
    DE_UNDER: "_"
    DE_COLON: ":"
    DE_AT: "@"

    # Standard mappings for DE_ macros and mod-morph parameters
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_SQT: "'"
    DE_DOT: "."
    DE_COMMA: ","
    DE_PERIOD: "."
    DE_N2: '"'
    BACKSLASH: "'"
    
    # Base Modifiers and Keys (<= 2 chars)
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PRINTSCREEN: "⎙"

    # Macros (<= 2 chars)
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(F): "⌃F"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_SEL: "BT"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  svg_extra_style: |
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    /* Style homerow keys purely by physical position in the SVG (indices 16-19 and 24-27) */
    g.key:nth-of-type(16) rect,
    g.key:nth-of-type(17) rect,
    g.key:nth-of-type(18) rect,
    g.key:nth-of-type(19) rect,
    g.key:nth-of-type(24) rect,
    g.key:nth-of-type(25) rect,
    g.key:nth-of-type(26) rect,
    g.key:nth-of-type(27) rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
    /* Shrink the font size of any key marked with type: small */
    g.small text {
      font-size: 17.5px !important;
    }
