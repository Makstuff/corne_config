parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  raw_binding_map:
    # Rename layer toggle behaviors so they are parsed directly as the final text
    '&to 0': 'TO\nBASE'
    '&to 1': 'TO\nSYM'
    '&to 2': 'TO\nNUM'
    '&to 3': 'TO\nNAV'
    '&to 4': 'TO\nMIR'
    '&to 5': 'TO\nSYS'
    
    # Map SYS layer colors (remembering to escape regex parentheses) and bootloader
    '&rgb_ug RGB_COLOR_HSB\\(0,100,50\\)': 'Red'
    '&rgb_ug RGB_COLOR_HSB\\(126,100,50\\)': 'Green'
    '&rgb_ug RGB_COLOR_HSB\\(244,100,50\\)': 'Blue'
    '&rgb_ug RGB_COLOR_HSB\\(309,100,50\\)': 'Purple'
    '&rgb_ug RGB_COLOR_HSB\\(61,100,50\\)': 'Yellow'
    '&bootloader': 'BOOT'
    
    # Strip kpb macro on MIR layer so it parses as the pure parameter
    '&kpb (.*)': '\1'

  zmk_keycode_map:
    # Base Layer Mod-Morphs (these are automatically resolved by keymap-drawer)
    DE_PERIOD: "."
    BACKSLASH: "'"
    DE_COMMA: ","
    DE_N2: '"'

    # SYM homerow keys 
    DE_EQUAL: "="
    DE_SEMI: ";"
    DE_LPAR: "("
    DE_RPAR: ")"
    DE_QMARK: "?"
    DE_UNDER: "_"
    DE_COLON: ":"
    DE_AT: "@"

    # Standard mappings for DE_ macros
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_SQT: "'"
    DE_DOT: "."
    
    # Base Modifiers and Keys
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PRINTSCREEN: "⎙"

    # Macros
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(LA(LG(C))): "Crop"
    LC(F): "⌃F"
    LG(DE_DOT): "Emoji"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_CLR: "BT CLR"
    BT_SEL: "BT"
    RGB_TOG: "RGB TG"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  svg_extra_style: |
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    /* Style homerow keys purely by physical position in the SVG (indices 16-19 and 24-27) */
    g.key:nth-of-type(16) rect,
    g.key:nth-of-type(17) rect,
    g.key:nth-of-type(18) rect,
    g.key:nth-of-type(19) rect,
    g.key:nth-of-type(24) rect,
    g.key:nth-of-type(25) rect,
    g.key:nth-of-type(26) rect,
    g.key:nth-of-type(27) rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
