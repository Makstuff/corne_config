parse_config:
  zmk_preamble: "#define KEYMAP_DRAWER 1"
  raw_binding_map:
    # Rename layer toggle behaviors so they are parsed as simple keys
    '&to 0': '&kp MY_TO_BASE'
    '&to 1': '&kp MY_TO_SYM'
    '&to 2': '&kp MY_TO_NUM'
    '&to 3': '&kp MY_TO_NAV'
    '&to 4': '&kp MY_TO_MIR'
    '&to 5': '&kp MY_TO_SYS'
    
    # Map SYS layer colors and bootloader to simple keys
    '&rgb_ug RGB_COLOR_HSB(0,100,50)': '&kp MY_RGB_RED'
    '&rgb_ug RGB_COLOR_HSB(126,100,50)': '&kp MY_RGB_GRN'
    '&rgb_ug RGB_COLOR_HSB(244,100,50)': '&kp MY_RGB_BLU'
    '&rgb_ug RGB_COLOR_HSB(309,100,50)': '&kp MY_RGB_PUR'
    '&rgb_ug RGB_COLOR_HSB(61,100,50)': '&kp MY_RGB_YEL'
    '&bootloader': '&kp MY_BOOT'
    
    # Strip kpb macro on MIR layer so it parses as a normal key
    '&kpb ': '&kp '

  zmk_keycode_map:
    # Layer toggles (using \n for linebreaks)
    MY_TO_BASE: {t: "TO\nBASE"}
    MY_TO_SYM: {t: "TO\nSYM"}
    MY_TO_NUM: {t: "TO\nNUM"}
    MY_TO_NAV: {t: "TO\nNAV"}
    MY_TO_MIR: {t: "TO\nMIR"}
    MY_TO_SYS: {t: "TO\nSYS"}
    
    # SYS Layer
    MY_RGB_RED: "Red"
    MY_RGB_GRN: "Green"
    MY_RGB_BLU: "Blue"
    MY_RGB_PUR: "Purple"
    MY_RGB_YEL: "Yellow"
    MY_BOOT: "BOOT"

    # Base Layer Mod-Morphs
    period: {t: ".", s: "'"}
    comma: {t: ",", s: '"'}

    # Re-adding SYM homerow keys that were accidentally deleted
    DE_EQUAL: "="
    DE_SEMI: ";"
    DE_LPAR: "("
    DE_RPAR: ")"
    DE_QMARK: "?"
    DE_UNDER: "_"
    DE_COLON: ":"
    DE_AT: "@"

    # Standard mappings for DE_ macros
    DE_A_UMLAUT: Ä
    DE_U_UMLAUT: Ü
    DE_O_UMLAUT: Ö
    DE_SHARP_S: ß
    DE_Y: Y
    DE_Z: Z
    DE_EURO: "€"
    DE_HASH: "#"
    DE_STAR: "*"
    DE_PLUS: "+"
    DE_DEG: "°"
    DE_CARET: "^"
    DE_DLLR: "$"
    DE_BSLH: "\\"
    DE_FSLH: "/"
    DE_MINUS: "-"
    DE_SECT: "§"
    DE_AMPS: "&"
    DE_LBRC: "{"
    DE_RBRC: "}"
    DE_PRCNT: "%"
    DE_GRAVE: "`"
    DE_ACUTE: "´"
    DE_EXCL: "!"
    DE_TILDE: "~"
    DE_PIPE: "|"
    DE_LBKT: "["
    DE_RBKT: "]"
    DE_GT: ">"
    DE_LT: "<"
    DE_COMMA: ","
    DE_SQT: "'"
    DE_DOT: "."
    
    # Base Modifiers and Keys
    LEFT_ALT: "⌥"
    LCTRL: "⌃"
    LSHFT: "⇧"
    LGUI: "❖"
    ESC: "⎋"
    DEL: "⌦"
    ENTER: "⏎"
    BACKSPACE: "⌫"
    SPACE: "␣"
    TAB: "⇥"
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    PRINTSCREEN: "⎙"

    # Macros
    LC(S): "⌃S"
    LC(DE_Z): "⌃Z"
    LC(DE_Y): "⌃Y"
    LC(LA(LG(C))): "Crop"
    LC(F): "⌃F"
    LG(DE_DOT): "Emoji"
    LC(A): "⌃A"
    LC(X): "⌃X"
    LC(C): "⌃C"
    LC(V): "⌃V"
    BT_CLR: "BT CLR"
    BT_SEL: "BT"
    RGB_TOG: "RGB TG"
  
  zmk_combos: {}
  mark_alternate_layer_activators: true

draw_config:
  svg_extra_style: |
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      font-size: 25px !important;
    }
    g.key rect {
      fill: #e2e8f0 !important;
      stroke: #64748b !important;
    }
    g.trans rect {
      fill: none !important;
      stroke-dasharray: 4;
    }
    /* Style homerow keys purely by physical position in the SVG (indices 16-19 and 24-27) */
    g.key:nth-of-type(16) rect,
    g.key:nth-of-type(17) rect,
    g.key:nth-of-type(18) rect,
    g.key:nth-of-type(19) rect,
    g.key:nth-of-type(24) rect,
    g.key:nth-of-type(25) rect,
    g.key:nth-of-type(26) rect,
    g.key:nth-of-type(27) rect {
      fill: #ffffff !important;
      stroke: #475569 !important;
    }
